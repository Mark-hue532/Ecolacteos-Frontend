[versions]
kotlin = "2.4.10"
agp = "9.4.0"
composeMultiplatform = "1.12.0"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
bignum = "0.3.10"
koin = "4.2.2"
ktor = "3.5.2"
sqldelight = "2.3.2"
lifecycle = "2.11.0"
turbine = "1.2.1"
androidxTestRunner = "1.7.1"
androidxTestJunit = "1.3.1"
androidMinSdk = "26"
# CLAUDE.md §4 fijaba compileSdk = 36, pero los artefactos Android de Compose Multiplatform 1.12.0
# (`androidx.compose.*-android`, 8 en total -- runtime, ui, foundation, animation) exigen `compileSdk >= 37`
# (verificado con un build real: `checkDebugAarMetadata` falla si no se sube). Son dos valores que CLAUDE.md
# §4 fija por separado y que no pueden convivir tal cual -- decisión aprobada en el checkpoint de la Fase 7:
# se sube compileSdk, `androidTargetSdk` se queda en 36 (compileSdk no cambia comportamiento en runtime).
androidCompileSdk = "37"
androidTargetSdk = "36"
androidxActivityCompose = "1.11.0"
# CLAUDE.md §4 fija `androidx.lifecycle 2.11.0` -- ese número es del grupo real de Google
# (`androidx.lifecycle:*`, Android-only). El `ViewModel` multiplataforma de Compose Multiplatform 1.12.0 lo
# publica JetBrains bajo un grupo y tren de versiones propio (`org.jetbrains.androidx.lifecycle:*`), que NO
# comparte numeración: 2.11.0 no existe ahí y rompe la resolución en los targets iOS (klib no publicado).
# 2.9.6 es la versión real que exige `navigation-compose 2.9.0-alpha16` de este mismo Compose Multiplatform
# -- confirmado con un build real, no supuesto (ver checkpoint de la Fase 7, sección "Decisiones tomadas").
androidxLifecycleViewmodelCompose = "2.9.6"
navigationCompose = "2.9.0-alpha16"
koinCompose = "4.2.2"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
bignum = { module = "com.ionspin.kotlin:bignum", version.ref = "bignum" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines-extensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
# JDBC -- solo para tests en memoria (jvmTest/androidUnitTest), nunca implementation de un target real
# (CLAUDE.md §4, `PROMPT_FASE_04.md §1`, trampa #7): un driver JDBC empaquetado en el APK/IPA es peso
# muerto y en Android puede chocar con `sqldelight-android-driver`.
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
# Compose Multiplatform (Fase 7, PROMPT_FASE_07.md §6): ViewModel multiplataforma sobre androidx.lifecycle,
# navegación (grafo de §2 de MOBILE_SCREENS.md) e inyección en Compose. Los tres son dependencias nuevas
# fuera de CLAUDE.md §4 -- justificadas en el checkpoint de la Fase 7.
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidxLifecycleViewmodelCompose" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycleViewmodelCompose" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koinCompose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koinCompose" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
# Mismo Kotlin Gradle Plugin ya fijado arriba (2.4.10) -- id de plugin para el módulo Android hoja
# `androidApp`, necesario porque el proyecto corre con `android.builtInKotlin=false` (ver gradle.properties).
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
