org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
kotlin.mpp.stability.nowarn=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9.x activa por defecto un DSL nuevo ("android.newDsl") con Kotlin incorporado que es incompatible
# con `org.jetbrains.kotlin.multiplatform` en el mismo subproyecto (`shared/`, que declara `androidTarget()`
# + `com.android.library`) -- ver decisión de la Fase 1 en el checkpoint. Estas dos flags son el mecanismo
# de bypass documentado por Google/JetBrains para mantener AGP 9.4.0 fijado sin migrar a
# `com.android.kotlin.multiplatform.library` (plugin nuevo, sin evidencia todavía en este proyecto).
# Google avisa que se retira en AGP 10.0 (~mediados de 2026): revisar al actualizar el catálogo.
android.newDsl=false
android.builtInKotlin=false

# Framework estático de iOS -- ver shared/build.gradle.kts (baseName = "shared").
kotlin.native.cocoapods.generate.wrapper=true

# Desactivar caché nativa de Kotlin/Native para evitar errores de enlace en CI iOS
kotlin.native.cacheKind=none
kotlin.native.cacheKind.iosSimulatorArm64=none
